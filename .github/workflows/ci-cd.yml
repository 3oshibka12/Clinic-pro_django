name: CI/CD Pipeline for Notify Service

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r notify_service/requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx

      - name: Lint with ruff
        run: ruff check notify_service/

      - name: Type check with mypy
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/notify_service
          mypy notify_service/ --ignore-missing-imports --explicit-package-bases
      - name: Test with pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/notify_service
          pytest --cov=notify_service --cov-fail-under=60 notify_service/tests/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker image
        run: |
          docker build -t ghcr.io/${{ env.REPO_NAME }}:latest \
                       -t ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }} \
                       -f notify_service/Dockerfile notify_service/
          
          docker push ghcr.io/${{ env.REPO_NAME }}:latest
          docker push ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy (ph)
        run: |
          echo "деплой версии ${{ github.sha }}"
