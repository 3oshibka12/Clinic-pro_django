name: Deploy and Check

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v2
        with:
          registry: git.klsh.ru
          username: team2
          password: ${{ secrets.RUNNER_TOKEN }}

      - name: Pull latest images
        run: docker compose -f docker-compose.prod.yml pull

      - name: Start All Containers
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Wait for services to start
        run: sleep 10

      - name: Check Django Monolith Health
        run: |
          docker logs team2_django_prod
          status_code=$(curl -s -o /dev/null -w "%{http_code}" http://team2.klsh.ru:8002)
          if [ "$status_code" -eq 200 ]; then
            echo "Django Monolith responded successfully on port 8002 with status $status_code!"
          else
            echo "Django failed to respond! Status code: $status_code"
            exit 1
          fi