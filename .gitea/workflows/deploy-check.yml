name: Deploy and Check

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v2
        with:
          registry: git.klsh.ru
          username: team2
          password: ${{ secrets.RUNNER_TOKEN }}

      - name: Pull latest images
        run: docker compose -f docker-compose.prod.yml pull

      - name: Start All Containers
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Wait for services to start
        run: sleep 10

      - name: Apply Database Migrations
        run: docker exec team2_django_prod python manage.py migrate

      - name: Check Django Monolith Health
        run: |
          # Запускаем Python-скрипт прямо внутри работающего контейнера
          status_code=$(docker exec team2_django_prod python -c "
          import urllib.request, urllib.error
          try:
              print(urllib.request.urlopen('http://127.0.0.1:8080/').getcode())
          except urllib.error.HTTPError as e:
              print(e.code)
          ")
          
          # Очищаем вывод от лишних пробелов
          status_code=$(echo $status_code | tr -d ' ')

          if [ "$status_code" -eq 200 ] || [ "$status_code" -eq 302 ] || [ "$status_code" -eq 401 ]; then
            echo "Django Monolith responded successfully with status $status_code!"
          else
            echo "Django failed! Status code: $status_code"
            exit 1
          fi

      - name: Print Django Logs on Failure
        if: failure()
        run: |
          echo "================ ЛОГИ КОНТЕЙНЕРА DJANGO ================"
          docker logs team2_django_prod
          echo "========================================================"